name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Resolve version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Unit tests and release build
        id: build
        run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee ci-build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: modifyx-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions' || true
          TAG="v${{ steps.version.outputs.name }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Modify-X ${{ steps.version.outputs.name }}" \
              --notes-file RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi

      - name: Publish diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "ref: $GITHUB_REF"
            echo "event: $GITHUB_EVENT_NAME"
            echo
            echo "=== token permissions ==="
            gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions' 2>&1 || true
            echo
            echo "=== build log tail ==="
            tail -c 40000 ci-build.log 2>/dev/null || echo "no build log"
          } > ci-diagnostics.txt
          git config user.name "Modify-X CI"
          git config user.email "ci@modifyx.local"
          git checkout -B ci-diagnostics
          git add -f ci-diagnostics.txt
          git commit -m "CI diagnostics for $GITHUB_SHA" || true
          git push -f origin ci-diagnostics || echo "diagnostics push refused"
